<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#08131b">
<title>Tu Tiên Cảnh — Web Edition</title>
<style>
:root{--gold:#e8ca87;--glass:rgba(7,17,25,.78);--line:rgba(232,202,135,.35);--mint:#9de0c4}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#07121b;color:#f4eee0;font-family:Georgia,"Times New Roman",serif;touch-action:manipulation}
#scene{position:fixed;inset:0;width:100%;height:100%;display:block}
.vignette{position:fixed;inset:0;pointer-events:none;background:linear-gradient(180deg,rgba(2,8,14,.3),transparent 30%,transparent 58%,rgba(2,8,14,.88));}
header{position:fixed;top:env(safe-area-inset-top,8px);left:0;right:0;padding:12px 15px 0;text-align:center;pointer-events:none;text-shadow:0 2px 12px #000}
h1{font-size:clamp(25px,7vw,38px);letter-spacing:4px;color:var(--gold);margin:0;font-weight:normal}
.subtitle{font-size:10px;letter-spacing:3px;text-transform:uppercase;color:#d2d6d2;margin-top:4px}
.status{position:fixed;top:83px;left:12px;right:12px;display:flex;justify-content:space-between;gap:8px;pointer-events:none}
.pill{background:rgba(5,14,22,.66);border:1px solid var(--line);border-radius:18px;padding:7px 10px;font-size:11px;backdrop-filter:blur(8px);white-space:nowrap}
#clock{color:var(--gold)}#realm{color:var(--mint)}
.panel{position:fixed;left:12px;right:12px;bottom:calc(14px + env(safe-area-inset-bottom,0px));padding:13px;background:var(--glass);border:1px solid var(--line);border-radius:18px;backdrop-filter:blur(12px);box-shadow:0 12px 40px #0006}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:8px 14px}
.stat-label{display:flex;justify-content:space-between;color:#c7c6bd;font-size:11px;margin-bottom:5px}
.track{height:5px;border-radius:8px;background:#26333a;overflow:hidden}.fill{height:100%;width:0;background:linear-gradient(90deg,#6da58c,#c6e6b4);transition:width .4s}
#qiFill{background:linear-gradient(90deg,#b08a43,#f4dc9b)}#spiritFill{background:linear-gradient(90deg,#647fd4,#c5d5ff)}
.message{font-size:12px;text-align:center;color:#e8d9b1;margin:11px 0 10px;min-height:17px}
.actions{display:grid;grid-template-columns:repeat(4,1fr);gap:7px}
button{font-family:inherit;color:#f7eed9;background:linear-gradient(180deg,#243b43,#12252d);border:1px solid rgba(232,202,135,.48);border-radius:12px;padding:11px 3px;font-size:11px;min-height:47px;cursor:pointer;touch-action:manipulation}
button:active{transform:scale(.97);background:#38544f}button .ico{display:block;font-size:18px;margin-bottom:3px}
.utility{display:flex;justify-content:space-between;align-items:center;margin-top:8px;font:10px Arial,sans-serif;color:#b7c0bc}
.utility button{min-height:30px;padding:5px 10px;font-size:10px;border-radius:9px}
#toast{position:fixed;left:50%;top:135px;transform:translateX(-50%);max-width:90%;text-align:center;background:#0b1b23e8;border:1px solid var(--line);border-radius:12px;padding:10px 14px;font-size:12px;opacity:0;transition:opacity .3s;pointer-events:none}
#toast.show{opacity:1}
@media(min-width:600px){.panel{max-width:430px;left:50%;right:auto;width:calc(100% - 24px);transform:translateX(-50%)}.status{max-width:430px;left:50%;right:auto;width:calc(100% - 24px);transform:translateX(-50%)}}
</style>
</head>
<body>
<canvas id="scene" aria-label="Cảnh núi tiên 3D"></canvas><div class="vignette"></div>
<header><h1>Tu Tiên Cảnh</h1><div class="subtitle">WEB EDITION · TĨNH TÂM TU LUYỆN</div></header>
<div class="status"><div class="pill" id="realm">◇ Luyện Khí · Tầng 1</div><div class="pill" id="clock">Đang đồng bộ thời gian…</div></div>
<div id="toast"></div>
<section class="panel">
 <div class="stats">
  <div><div class="stat-label"><span>Linh khí</span><span id="qiText">0 / 100</span></div><div class="track"><div class="fill" id="qiFill"></div></div></div>
  <div><div class="stat-label"><span>Tâm cảnh</span><span id="spiritText">100%</span></div><div class="track"><div class="fill" id="spiritFill" style="width:100%"></div></div></div>
  <div><div class="stat-label"><span>Đạo hạnh</span><span id="xpText">0 năm</span></div><div class="track"><div class="fill" id="xpFill"></div></div></div>
  <div><div class="stat-label"><span>Thiền định</span><span id="medText">0 phút</span></div><div class="track"><div class="fill" id="medFill"></div></div></div>
 </div>
 <div class="message" id="message">Mây trôi qua núi, tâm lặng như hồ.</div>
 <div class="actions">
  <button id="meditate"><span class="ico">🧘</span>Nhập định</button>
  <button id="breathe"><span class="ico">🌬️</span>Điều tức</button>
  <button id="bell"><span class="ico">🔔</span>Chuông thiền</button>
  <button id="realmUp"><span class="ico">☯</span>Đột phá</button>
 </div>
 <div class="utility"><span>Âm thanh thiên nhiên · Lưu tự động trong phiên</span><button id="sound">♪ Bật âm thanh</button></div>
</section>
<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>
<script>
(()=> {
const $=id=>document.getElementById(id);
let qi=0,xp=0,medMinutes=0,spirit=100,meditating=false,soundOn=false,audioCtx=null,osc=null,gain=null,toastTimer;
let realmIndex=0;
const realms=[["Luyện Khí",100],["Trúc Cơ",220],["Kim Đan",400],["Nguyên Anh",700],["Hóa Thần",1100],["Độ Kiếp",1800]];
function toast(s){$('toast').textContent=s;$('toast').classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>$('toast').classList.remove('show'),2300)}
function updateUI(){
 $('qiText').textContent=`${Math.floor(qi)} / ${realms[realmIndex][1]}`;
 $('qiFill').style.width=Math.min(100,qi/realms[realmIndex][1]*100)+'%';
 $('spiritText').textContent=Math.round(spirit)+'%';$('spiritFill').style.width=spirit+'%';
 $('xpText').textContent=xp+' năm';$('xpFill').style.width=Math.min(100,xp/1000*100)+'%';
 $('medText').textContent=medMinutes+' phút';$('medFill').style.width=Math.min(100,medMinutes/60*100)+'%';
 $('realm').textContent=`◇ ${realms[realmIndex][0]} · Tầng ${realmIndex+1}`;
}
function gainQi(n){qi+=n;xp+=Math.max(0,Math.floor(n/10));if(qi>=realms[realmIndex][1])toast('Linh khí đã viên mãn. Hãy thử Đột phá!');updateUI()}
$('meditate').onclick=()=>{meditating=!meditating;$('meditate').innerHTML=meditating?'<span class="ico">✨</span>Xuất định':'<span class="ico">🧘</span>Nhập định';$('message').textContent=meditating?'Tâm quy nhất niệm… linh khí đang hội tụ.':'Tâm an, khí hòa. Hãy trở lại khi muốn.';toast(meditating?'Bắt đầu nhập định.':'Đã kết thúc nhập định.');};
$('breathe').onclick=()=>{spirit=Math.min(100,spirit+12);gainQi(4);$('message').textContent='Hít vào thanh khí, thở ra phiền muộn.';toast('Điều tức hoàn tất · +4 linh khí');};
$('bell').onclick=()=>{playBell();spirit=Math.min(100,spirit+5);$('message').textContent='Một tiếng chuông, vạn niệm lắng yên.';toast('Tiếng chuông vọng giữa sơn cốc.');};
$('realmUp').onclick=()=>{if(qi<realms[realmIndex][1]){toast('Linh khí chưa đủ để đột phá. Hãy tiếp tục tu luyện.');return;}if(realmIndex>=realms.length-1){toast('Đã đến cảnh giới tối cao trong bản thử nghiệm!');return;}qi-=realms[realmIndex][1];realmIndex++;spirit=Math.max(40,spirit-10);updateUI();toast('Đột phá thành công: '+realms[realmIndex][0]+'!');$('message').textContent='Đạo tâm vững vàng, cảnh giới lại mở rộng.';};
$('sound').onclick=()=>{soundOn=!soundOn;if(soundOn)startAmbient();else stopAmbient();$('sound').textContent=soundOn?'♫ Tắt âm thanh':'♪ Bật âm thanh';toast(soundOn?'Đã bật âm thanh nền.':'Đã tắt âm thanh nền.');};
function startAmbient(){try{audioCtx=audioCtx||new(window.AudioContext||window.webkitAudioContext)();audioCtx.resume();osc=audioCtx.createOscillator();gain=audioCtx.createGain();const filter=audioCtx.createBiquadFilter();osc.type='sine';osc.frequency.value=110;filter.type='lowpass';filter.frequency.value=250;gain.gain.value=.018;osc.connect(filter);filter.connect(gain);gain.connect(audioCtx.destination);osc.start();}catch(e){toast('Thiết bị không hỗ trợ âm thanh Web Audio.');}}
function stopAmbient(){if(osc){try{osc.stop()}catch(e){}osc=null}if(gain)gain.gain.value=0;}
function playBell(){if(!soundOn)return;try{const c=audioCtx||new(window.AudioContext||window.webkitAudioContext)();const o=c.createOscillator(),g=c.createGain();o.type='sine';o.frequency.value=660;g.gain.setValueAtTime(.12,c.currentTime);g.gain.exponentialRampToValueAtTime(.001,c.currentTime+2);o.connect(g);g.connect(c.destination);o.start();o.stop(c.currentTime+2);}catch(e){}}
function clock(){const d=new Date();$('clock').textContent=d.toLocaleDateString('vi-VN',{weekday:'short',day:'2-digit',month:'2-digit'})+' · '+d.toLocaleTimeString('vi-VN',{hour:'2-digit',minute:'2-digit',second:'2-digit'});}
setInterval(clock,1000);clock();updateUI();
setInterval(()=>{if(meditating){gainQi(1);medMinutes+=1;spirit=Math.min(100,spirit+.1);if(medMinutes%5===0)$('message').textContent='Tĩnh tâm '+medMinutes+' phút · linh khí dần ngưng tụ.';updateUI();}},1000);

// Procedural Three.js landscape: stylized cinematic mountain valley, floating mist, shrine, seated cultivator.
const canvas=$('scene');let renderer,scene,camera,clock3,particles=[],mist=[];
if(window.THREE){
 renderer=new THREE.WebGLRenderer({canvas,antialias:true,alpha:false});renderer.setPixelRatio(Math.min(devicePixelRatio,1.8));renderer.setSize(innerWidth,innerHeight);renderer.outputColorSpace=THREE.SRGBColorSpace;
 scene=new THREE.Scene();scene.background=new THREE.Color(0x101f2a);scene.fog=new THREE.FogExp2(0x172b35,.035);
 camera=new THREE.PerspectiveCamera(42,innerWidth/innerHeight,.1,100);camera.position.set(0,3.1,10.8);camera.lookAt(0,1.6,0);
 scene.add(new THREE.HemisphereLight(0x9fbac8,0x15201c,2));
 const moonLight=new THREE.DirectionalLight(0xffdfad,2.2);moonLight.position.set(-4,8,5);scene.add(moonLight);
 const fillLight=new THREE.PointLight(0x6ca4c2,1.8,18);fillLight.position.set(3,3,2);scene.add(fillLight);
 const mat=(color,roughness=1,metalness=0)=>new THREE.MeshStandardMaterial({color,roughness,metalness});
 const ground=new THREE.Mesh(new THREE.PlaneGeometry(80,80),mat(0x182a28));ground.rotation.x=-Math.PI/2;ground.position.y=-.1;scene.add(ground);
 // layered mountain silhouettes
 function mountain(x,z,h,w,color){const geo=new THREE.ConeGeometry(w,h,5,1);const m=new THREE.Mesh(geo,mat(color));m.position.set(x,h/2-0.3,z);m.rotation.y=.3+(x%2)*.15;scene.add(m);const cap=new THREE.Mesh(new THREE.ConeGeometry(w*.22,h*.18,5),mat(0x9babb0));cap.position.set(x,h*.87-.3,z);cap.rotation.y=m.rotation.y;scene.add(cap);}
 for(let i=0;i<16;i++){let x=(i-7.5)*2.6;mountain(x,-7-(i%4)*2,4+(i%5)*1.25,1.5+(i%3)*.5,i%2?0x253d46:0x304851);}
 for(let i=0;i<10;i++){let x=(i-4.5)*3.4;mountain(x,-14,8+(i%4),2.5,0x1c303b);}
 // moon
 const moon=new THREE.Mesh(new THREE.SphereGeometry(.72,24,24),new THREE.MeshBasicMaterial({color:0xf2dfb0}));moon.position.set(3.1,6.3,-12);scene.add(moon);
 const halo=new THREE.Mesh(new THREE.SphereGeometry(.95,24,24),new THREE.MeshBasicMaterial({color:0xb6cbd1,transparent:true,opacity:.08}));halo.position.copy(moon.position);scene.add(halo);
 // stone meditation platform
 const platform=new THREE.Mesh(new THREE.CylinderGeometry(1.65,1.85,.28,9),mat(0x52615d));platform.position.set(0,.08,1);scene.add(platform);
 const ring=new THREE.Mesh(new THREE.TorusGeometry(1.35,.025,8,80),new THREE.MeshBasicMaterial({color:0xd5b875,transparent:true,opacity:.65}));ring.rotation.x=Math.PI/2;ring.position.set(0,.24,1);scene.add(ring);
 // seated figure: layered robes and hood/head
 const robe=new THREE.Mesh(new THREE.SphereGeometry(.72,24,18),mat(0x263f46));robe.scale.set(.9,1.05,.7);robe.position.set(0,1.12,1);scene.add(robe);
 const robeBase=new THREE.Mesh(new THREE.CylinderGeometry(.55,.9,.55,16),mat(0x1b3037));robeBase.position.set(0,.65,1);scene.add(robeBase);
 const head=new THREE.Mesh(new THREE.SphereGeometry(.25,20,16),mat(0xc8a984));head.position.set(0,2.02,1);scene.add(head);
 const hood=new THREE.Mesh(new THREE.SphereGeometry(.29,20,14,0,Math.PI*2,0,Math.PI*.62),mat(0x18292f));hood.position.set(0,2.07,1);scene.add(hood);
 const hair=new THREE.Mesh(new THREE.SphereGeometry(.28,16,12,0,Math.PI*2,0,Math.PI*.55),mat(0x111a20));hair.position.set(0,2.19,1);scene.add(hair);
 // folded legs and arms
 for(const side of [-1,1]){const leg=new THREE.Mesh(new THREE.SphereGeometry(.43,18,12),mat(0x314e54));leg.scale.set(1,.36,.75);leg.position.set(side*.31,.64,1.13);scene.add(leg);
 const arm=new THREE.Mesh(new THREE.CapsuleGeometry(.12,.56,4,8),mat(0x36545a));arm.position.set(side*.48,1.35,1.16);arm.rotation.z=side*.72;scene.add(arm);
 const hand=new THREE.Mesh(new THREE.SphereGeometry(.13,12,10),mat(0xc8a984));hand.position.set(side*.22,1.17,1.4);scene.add(hand);}
 // aura rings
 const aura=new THREE.Mesh(new THREE.TorusGeometry(1.02,.018,8,80),new THREE.MeshBasicMaterial({color:0x9ddbc6,transparent:true,opacity:.42}));aura.position.set(0,1.45,.98);scene.add(aura);
 // lanterns
 for(const x of [-2.2,2.2]){const pole=new THREE.Mesh(new THREE.CylinderGeometry(.035,.05,.8,8),mat(0x66513a));pole.position.set(x,.48,1);scene.add(pole);const lamp=new THREE.Mesh(new THREE.SphereGeometry(.14,12,10),new THREE.MeshBasicMaterial({color:0xf4c76f}));lamp.position.set(x,.95,1);scene.add(lamp);const light=new THREE.PointLight(0xf2b965,.7,3);light.position.copy(lamp.position);scene.add(light);}
 // drifting glowing qi particles
 const pGeo=new THREE.SphereGeometry(.025,6,6);
 for(let i=0;i<90;i++){const p=new THREE.Mesh(pGeo,new THREE.MeshBasicMaterial({color:i%4===0?0xf0d48e:0x9edbc8,transparent:true,opacity:.35+Math.random()*.5}));p.position.set((Math.random()-.5)*9,Math.random()*5-0.2,(Math.random()-.5)*7);p.userData={speed:.15+Math.random()*.45,phase:Math.random()*6.28,baseY:p.position.y};scene.add(p);particles.push(p);}
 // low rolling mist bands
 for(let i=0;i<5;i++){const m=new THREE.Mesh(new THREE.PlaneGeometry(9,.7),new THREE.MeshBasicMaterial({color:0x9db8b9,transparent:true,opacity:.055,depthWrite:false,side:THREE.DoubleSide}));m.position.set((i-2)*1.5,.22+i*.13,-1-i*1.6);m.rotation.x=-.08;scene.add(m);mist.push(m);}
 clock3=new THREE.Clock();
 function animate(){requestAnimationFrame(animate);const t=clock3.getElapsedTime();particles.forEach(p=>{p.position.y=p.userData.baseY+Math.sin(t*p.userData.speed+p.userData.phase)*.32;p.position.x+=Math.sin(t*.2+p.userData.phase)*.0018;if(p.position.y>5.3)p.position.y=-.2;});mist.forEach((m,i)=>{m.position.x=Math.sin(t*.16+i)*1.7+(i-2)*1.3;m.position.z=-1-i*1.6+Math.sin(t*.1+i)*.3;});aura.rotation.z=t*.13;aura.scale.setScalar(1+Math.sin(t*1.1)*.045);robe.position.y=1.12+Math.sin(t*1.3)*.025;head.position.y=2.02+Math.sin(t*1.3)*.025;renderer.render(scene,camera);}
 animate();
 addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(Math.min(devicePixelRatio,1.8));});
}else{const c=canvas.getContext('2d');c.fillStyle='#152b35';c.fillRect(0,0,innerWidth,innerHeight);c.fillStyle='#e8ca87';c.font='24px serif';c.fillText('Tu Tiên Cảnh',30,150);c.font='14px sans-serif';c.fillText('Cần kết nối internet để tải thư viện đồ họa 3D.',30,180);}
})();
</script>
</body>
</html>
