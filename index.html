
<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SEN AN VIÊN - Chibi World</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div id="loading">🌸 Đang tải SEN AN VIÊN...</div>

  <header class="topbar">
    <div class="logo">🌸 SEN AN VIÊN</div>
    <div class="profile">
      <span>👤 Người chơi</span>
      <span>⭐ Cấp 1</span>
      <span>🌸 <b id="points">0</b></span>
    </div>
  </header>

  <main id="game-container"></main>

  <section class="quest-panel">
    <h3>📜 Nhiệm vụ hôm nay</h3>
    <p>🌸 Khám phá khu vườn sen</p>
    <p>🏯 Thăm quan ngôi chùa</p>
    <p>🧘 Thực hiện thiền định</p>
    <button id="interact">Tương tác</button>
    <p id="message">Chào mừng bạn đến SEN AN VIÊN!</p>
  </section>

  <div class="mobile-controls">
    <button data-key="forward">▲</button>
    <div>
      <button data-key="left">◀</button>
      <button data-key="backward">▼</button>
      <button data-key="right">▶</button>
    </div>
  </div>

  <footer>
    WASD / Mũi tên: Di chuyển | E: Tương tác
  </footer>

  <script type="module" src="game.js"></script>
</body>
</html>
