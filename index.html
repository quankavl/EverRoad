<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0b1720">
<title>Thế Giới Mưa Việt — Một góc bình yên</title>
<style>
:root{--glass:rgba(8,18,25,.62);--line:rgba(255,255,255,.15);--text:#f3f6f5;--muted:#c1cecf;--accent:#c2dfd9}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#09131b;color:var(--text);font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}
#scene{position:fixed;inset:0;overflow:hidden;background:linear-gradient(#162a37 0%,#354b54 45%,#172a2c 100%);transition:background 1.2s}
.sky{position:absolute;inset:0;background:radial-gradient(ellipse at 72% 25%,rgba(207,222,220,.18),transparent 26%),linear-gradient(180deg,rgba(9,20,30,.1),rgba(4,12,16,.62))}
.moon{position:absolute;top:14%;right:19%;width:90px;height:90px;border-radius:50%;background:rgba(224,235,224,.16);box-shadow:0 0 80px 25px rgba(206,227,225,.12);filter:blur(1px)}
.mountains{position:absolute;bottom:0;left:-5%;width:110%;height:52%;background:linear-gradient(145deg,transparent 0 12%,#1c3438 12.2% 30%,transparent 30.2%),linear-gradient(35deg,transparent 0 24%,#203b3d 24.2% 49%,transparent 49.2%),linear-gradient(150deg,transparent 0 28%,#102629 28.2% 65%,transparent 65.2%);opacity:.8}
.hills{position:absolute;bottom:-8%;left:-10%;width:120%;height:38%;border-radius:50% 50% 0 0;background:linear-gradient(180deg,#173432,#081a1c 78%);box-shadow:0 -20px 80px rgba(10,24,25,.4)}
.forest{position:absolute;bottom:0;left:0;width:100%;height:44%;display:flex;align-items:flex-end;justify-content:space-around;opacity:.85}
.tree{position:relative;width:0;height:0;border-left:clamp(25px,4vw,60px) solid transparent;border-right:clamp(25px,4vw,60px) solid transparent;border-bottom:clamp(100px,24vh,270px) solid #0c2424;filter:drop-shadow(0 0 14px rgba(0,0,0,.3))}
.tree:after{content:"";position:absolute;left:calc(clamp(25px,4vw,60px) * -.15);top:clamp(85px,19vh,215px);width:clamp(10px,1.4vw,22px);height:100px;background:#101e1c}
#rain{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.vignette{position:absolute;inset:0;background:radial-gradient(ellipse at center,transparent 20%,rgba(2,8,12,.35) 100%);pointer-events:none}
header{position:absolute;top:0;left:0;right:0;display:flex;justify-content:space-between;align-items:center;padding:24px clamp(18px,4vw,56px);z-index:3}
.brand{font-size:12px;letter-spacing:.22em;font-weight:750;color:#e7f0ed}.brand span{display:block;font-size:10px;letter-spacing:.12em;color:#aebfbe;margin-top:5px;font-weight:500}
.top-actions{display:flex;gap:9px}.pill,.icon-btn{border:1px solid var(--line);background:rgba(8,18,25,.34);color:var(--text);backdrop-filter:blur(12px);border-radius:999px;padding:10px 15px;font-size:12px;cursor:pointer;transition:.2s}.pill:hover,.icon-btn:hover{background:rgba(255,255,255,.12);border-color:rgba(255,255,255,.32)}
main{position:absolute;z-index:2;inset:0;display:flex;align-items:center;padding:100px clamp(18px,8vw,112px) 200px;pointer-events:none}
.hero{max-width:600px;pointer-events:auto}.eyebrow{color:#c1d7d1;text-transform:uppercase;letter-spacing:.25em;font-size:11px;margin-bottom:20px}.hero h1{font-size:clamp(42px,7vw,88px);font-weight:500;letter-spacing:-.055em;line-height:.98;margin:0 0 22px;text-shadow:0 4px 30px #071319}.hero p{color:#d0dcda;max-width:410px;line-height:1.75;font-size:15px;margin:0 0 27px}
.actions{display:flex;gap:10px;flex-wrap:wrap}.primary{background:#e2eeea;color:#122421;border:0;border-radius:999px;padding:13px 20px;font-weight:700;font-size:12px;cursor:pointer}.secondary{background:rgba(5,15,20,.3);color:white;border:1px solid var(--line);border-radius:999px;padding:13px 20px;font-size:12px;cursor:pointer}
.bottom{position:absolute;z-index:3;left:clamp(18px,4vw,56px);right:clamp(18px,4vw,56px);bottom:22px;display:grid;grid-template-columns:1fr auto 1fr;align-items:end;gap:18px}
.now-playing{font-size:11px;color:#d8e3e0;letter-spacing:.08em}.now-playing strong{display:block;font-size:13px;letter-spacing:0;margin-top:7px;font-weight:550}.worlds{display:flex;gap:7px;justify-content:center;flex-wrap:wrap}
.world{padding:10px 13px;border-radius:999px;background:rgba(7,17,23,.48);border:1px solid var(--line);color:#d5e0de;font-size:11px;cursor:pointer;backdrop-filter:blur(12px)}.world.active{background:rgba(220,237,231,.92);color:#142320;border-color:transparent}
.controls{display:flex;justify-content:flex-end;gap:8px}.control-card{min-width:116px;padding:11px 13px;border:1px solid var(--line);border-radius:14px;background:var(--glass);backdrop-filter:blur(14px)}.control-card label{display:flex;justify-content:space-between;gap:10px;font-size:10px;color:#c5d2d0;margin-bottom:8px}.control-card input{width:100%;accent-color:#c2dfd9}.control-card button{border:0;background:transparent;color:#e5eeeb;font-size:11px;cursor:pointer;padding:0}
.toast{position:absolute;top:85px;left:50%;transform:translateX(-50%);z-index:6;padding:10px 16px;border:1px solid var(--line);border-radius:99px;background:rgba(4,14,20,.78);font-size:12px;color:#eaf2ef;opacity:0;transition:opacity .25s;pointer-events:none}.toast.show{opacity:1}
@media(max-width:760px){header{padding-top:17px}.brand{font-size:10px}.top-actions .pill{padding:9px 11px}main{align-items:flex-start;padding-top:22vh;padding-bottom:250px}.hero h1{font-size:clamp(43px,12vw,68px)}.hero p{font-size:13px;max-width:330px}.bottom{grid-template-columns:1fr;bottom:12px;gap:10px}.now-playing{display:none}.worlds{justify-content:flex-start;order:1}.controls{justify-content:flex-start;order:2}.control-card{flex:1;min-width:0}.world{padding:9px 11px}.moon{width:60px;height:60px}.forest{height:35%}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div id="scene" data-world="forest">
  <div class="sky"></div><div class="moon"></div><div class="mountains"></div><div class="hills"></div>
  <div class="forest" id="forest"></div><canvas id="rain"></canvas><div class="vignette"></div>
</div>
<header>
  <div class="brand">THẾ GIỚI MƯA VIỆT<span>MỘT GÓC NHỎ ĐỂ THỞ</span></div>
  <div class="top-actions"><button class="pill" id="soundTop">♫ Âm thanh: tắt</button><button class="icon-btn" id="help" aria-label="Hướng dẫn">?</button></div>
</header>
<div class="toast" id="toast" role="status"></div>
<main><section class="hero">
  <div class="eyebrow">CHẬM LẠI · LẮNG NGHE · THƯ GIÃN</div>
  <h1 id="title">Rừng đêm<br>mưa dịu dàng</h1>
  <p id="description">Mưa rơi qua tán lá, sương mờ ôm lấy triền núi. Hãy dành một phút cho riêng mình, không cần vội vã đi đâu cả.</p>
  <div class="actions"><button class="primary" id="start">▶ Bắt đầu thư giãn</button><button class="secondary" id="change">Đổi khung cảnh ↗</button></div>
</section></main>
<section class="bottom">
  <div class="now-playing">KHÔNG GIAN HIỆN TẠI<strong id="current">01 — Rừng đêm</strong></div>
  <nav class="worlds" aria-label="Chọn khung cảnh">
    <button class="world active" data-id="forest">01 Rừng đêm</button><button class="world" data-id="coast">02 Bờ biển</button><button class="world" data-id="city">03 Phố đêm</button><button class="world" data-id="field">04 Đồng cỏ</button><button class="world" data-id="mountain">05 Đèo mây</button><button class="world" data-id="cabin">06 Hiên nhà</button>
  </nav>
  <div class="controls">
    <div class="control-card"><label for="rainLevel">Cường độ mưa <span id="rainValue">55%</span></label><input id="rainLevel" type="range" min="0" max="100" value="55"></div>
    <div class="control-card"><label for="windLevel">Gió <span id="windValue">25%</span></label><input id="windLevel" type="range" min="0" max="100" value="25"></div>
    <div class="control-card"><label>Không gian</label><button id="pause">Ⅱ Tạm dừng mưa</button></div>
  </div>
</section>
<script>
(() => {
const $=s=>document.querySelector(s);
const worlds={
 forest:{title:'Rừng đêm<br>mưa dịu dàng',desc:'Mưa rơi qua tán lá, sương mờ ôm lấy triền núi. Hãy dành một phút cho riêng mình, không cần vội vã đi đâu cả.',name:'01 — Rừng đêm',bg:'linear-gradient(#162a37 0%,#354b54 45%,#172a2c 100%)',hills:'#173432',trees:true},
 coast:{title:'Bờ biển<br>trong màn mưa',desc:'Sóng chậm rãi chạm bờ, gió mang theo vị mặn của biển. Hít một hơi thật sâu và để mọi âm thanh dịu xuống.',name:'02 — Bờ biển',bg:'linear-gradient(#293e4c 0%,#71858a 45%,#1b3d48 100%)',hills:'#244550',trees:false},
 city:{title:'Phố nhỏ<br>ánh đèn khuya',desc:'Ánh đèn vàng loang trên mặt đường ướt. Thành phố vẫn thức, nhưng ở đây bạn có thể thong thả nghỉ ngơi.',name:'03 — Phố đêm',bg:'linear-gradient(#101725 0%,#373b4c 50%,#171d28 100%)',hills:'#171c28',trees:false},
 field:{title:'Đồng cỏ<br>mưa đầu mùa',desc:'Cỏ nghiêng mình theo làn gió, mây xám trôi thật chậm. Một khoảng trời rộng mở dành cho những phút bình yên.',name:'04 — Đồng cỏ',bg:'linear-gradient(#344b57 0%,#7c8c87 48%,#263f39 100%)',hills:'#294538',trees:false},
 mountain:{title:'Đèo mây<br>ẩn trong sương',desc:'Những dãy núi xa dần khuất sau lớp sương bạc. Tiếng mưa đều đặn như nhắc ta cứ đi từng bước, thật nhẹ nhàng.',name:'05 — Đèo mây',bg:'linear-gradient(#263947 0%,#657b80 48%,#263c3c 100%)',hills:'#1b3032',trees:true},
 cabin:{title:'Hiên nhà<br>ngày mưa yên ả',desc:'Tưởng tượng bạn đang ngồi bên hiên nhà, nghe mưa gõ nhịp trên mái và nhìn màn sương phủ ngoài vườn.',name:'06 — Hiên nhà',bg:'linear-gradient(#293b45 0%,#65716f 45%,#172b29 100%)',hills:'#1c3530',trees:true}
};
let current='forest',paused=false, rainAmount=55,wind=25, audioOn=false, audioCtx=null, noiseSource=null, gain=null, filter=null;
const scene=$('#scene'), canvas=$('#rain'), ctx=canvas.getContext('2d');let drops=[],w=0,h=0,raf;
function trees(){const el=$('#forest');el.innerHTML='';let n=window.innerWidth<700?9:17;for(let i=0;i<n;i++){let t=document.createElement('i');t.className='tree';t.style.transform=`scale(${.45+Math.random()*.8})`;t.style.opacity=.3+Math.random()*.6;el.appendChild(t)}}
function resize(){w=canvas.width=innerWidth*devicePixelRatio;h=canvas.height=innerHeight*devicePixelRatio;canvas.style.width=innerWidth+'px';canvas.style.height=innerHeight+'px';ctx.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0);w=innerWidth;h=innerHeight;makeDrops();trees()}
function makeDrops(){let count=Math.round(rainAmount*5);drops=Array.from({length:count},()=>({x:Math.random()*w,y:Math.random()*h,len:5+Math.random()*15,speed:5+Math.random()*8,alpha:.12+Math.random()*.38}))}
function draw(){ctx.clearRect(0,0,w,h);if(!paused){for(const d of drops){d.y+=d.speed;d.x+=wind/18;if(d.y>h){d.y=-20;d.x=Math.random()*w}if(d.x>w+20)d.x=-10;ctx.strokeStyle=`rgba(211,229,232,${d.alpha})`;ctx.lineWidth=.7;ctx.beginPath();ctx.moveTo(d.x,d.y);ctx.lineTo(d.x-wind/100,d.y+d.len);ctx.stroke()}}raf=requestAnimationFrame(draw)}
function toast(s){const t=$('#toast');t.textContent=s;t.classList.add('show');clearTimeout(toast.timer);toast.timer=setTimeout(()=>t.classList.remove('show'),2300)}
function setWorld(id){current=id;const a=worlds[id];scene.style.background=a.bg;$('.hills').style.background=`linear-gradient(180deg,${a.hills},#081719 78%)`;$('.moon').style.display=id==='city'?'none':'block';$('.mountains').style.opacity=['coast','city','field'].includes(id)?'.22':'.8';$('#title').innerHTML=a.title;$('#description').textContent=a.desc;$('#current').textContent=a.name;document.querySelectorAll('.world').forEach(b=>b.classList.toggle('active',b.dataset.id===id));$('#forest').style.opacity=a.trees?'.85':'0';toast('Đã chuyển sang '+a.name.toLowerCase())}
function setAudio(on){audioOn=on;if(on){try{audioCtx=audioCtx||new (window.AudioContext||window.webkitAudioContext)();audioCtx.resume();if(!noiseSource){const buffer=audioCtx.createBuffer(1,audioCtx.sampleRate*2,audioCtx.sampleRate);const data=buffer.getChannelData(0);for(let i=0;i<data.length;i++)data[i]=Math.random()*2-1;noiseSource=audioCtx.createBufferSource();noiseSource.buffer=buffer;noiseSource.loop=true;filter=audioCtx.createBiquadFilter();filter.type='lowpass';filter.frequency.value=1100;gain=audioCtx.createGain();gain.gain.value=.12;noiseSource.connect(filter);filter.connect(gain);gain.connect(audioCtx.destination);noiseSource.start()}gain.gain.setTargetAtTime(.12*(rainAmount/55),audioCtx.currentTime,.15)}catch(e){toast('Trình duyệt chưa hỗ trợ âm thanh này');audioOn=false}}else if(gain&&audioCtx){gain.gain.setTargetAtTime(0,audioCtx.currentTime,.1)}$('#soundTop').textContent=audioOn?'♫ Âm thanh: bật':'♫ Âm thanh: tắt';if(audioOn)toast('Đã bật âm thanh mưa')}
document.querySelectorAll('.world').forEach(b=>b.addEventListener('click',()=>setWorld(b.dataset.id)));
$('#change').addEventListener('click',()=>{const ids=Object.keys(worlds);setWorld(ids[(ids.indexOf(current)+1)%ids.length])});
$('#start').addEventListener('click',()=>{setAudio(true);paused=false;$('#pause').textContent='Ⅱ Tạm dừng mưa';toast('Hãy thả lỏng và tận hưởng khoảnh khắc này')});
$('#soundTop').addEventListener('click',()=>setAudio(!audioOn));
$('#help').addEventListener('click',()=>toast('Chọn khung cảnh, chỉnh mưa và gió. Bật âm thanh để nghe tiếng mưa mô phỏng.'));
$('#pause').addEventListener('click',()=>{paused=!paused;$('#pause').textContent=paused?'▶ Tiếp tục mưa':'Ⅱ Tạm dừng mưa';toast(paused?'Đã tạm dừng hiệu ứng mưa':'Mưa lại rơi rồi')});
$('#rainLevel').addEventListener('input',e=>{rainAmount=+e.target.value;$('#rainValue').textContent=rainAmount+'%';makeDrops();if(gain&&audioCtx&&audioOn)gain.gain.setTargetAtTime(.12*(rainAmount/55),audioCtx.currentTime,.1)});
$('#windLevel').addEventListener('input',e=>{wind=+e.target.value;$('#windValue').textContent=wind+'%'});
document.addEventListener('keydown',e=>{if(e.key===' '){e.preventDefault();paused=!paused;$('#pause').textContent=paused?'▶ Tiếp tục mưa':'Ⅱ Tạm dừng mưa'}if(e.key.toLowerCase()==='m')setAudio(!audioOn);if(e.key==='Escape')toast('Chúc bạn có những phút giây bình yên')});
addEventListener('resize',resize);resize();draw();
})();
</script>
</body>
</html>
